<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שרי שטיין – הנושאים בקליניקה</title>
<style>
  :root{--bg:#cfdcc4;--tile:#f3ece0;--ink:#4f6b4a;--line:#6b8a63}
  *{box-sizing:border-box}
  body{margin:0;background:#e9e4da;font-family:"Assistant","Heebo",Arial,sans-serif;color:var(--ink)}
  .card{max-width:520px;margin:0 auto;padding:40px 16px 48px;background:var(--bg);min-height:100vh}
  h1{font-size:1.9rem;line-height:1.35;text-align:center;font-weight:600;margin:0 0 32px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:var(--tile);border-radius:10px;padding:22px 10px 18px;text-align:center;
        display:flex;flex-direction:column;align-items:center;gap:14px;min-height:130px;justify-content:center}
  .tile svg{width:54px;height:54px;fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .tile span{font-size:1rem}
</style>
</head>
<body>
<main class="card">
  <h1>הנושאים שאני עובדת<br>עליהם בקליניקה</h1>
  <!-- RTL grid: first item sits on the right -->
  <div class="grid">
    <div class="tile"><svg viewBox="0 0 48 48"><path d="M24 40S6 29 6 17a9 9 0 0 1 18-3 9 9 0 0 1 18 3c0 12-18 23-18 23z"/><path d="M24 14l-4 8 6 3-4 8"/></svg><span>טראומה וטראומה מינית</span></div>
    <div class="tile"><svg viewBox="0 0 48 48"><path d="M8 16c5-4 8 4 16 0s11 4 16 0M8 24c5-4 8 4 16 0s11 4 16 0M8 32c5-4 8 4 16 0s11 4 16 0"/></svg><span>חרדה</span></div>
    <div class="tile"><svg viewBox="0 0 48 48"><path d="M14 34h20a7 7 0 0 0 0-14 10 10 0 0 0-19-2 8 8 0 0 0-1 16z"/><circle cx="36" cy="10" r="3"/><path d="M18 40l-1 3M25 40l-1 3M32 40l-1 3"/></svg><span>קשיים רגשיים</span></div>
    <div class="tile"><svg viewBox="0 0 48 48"><circle cx="18" cy="24" r="10"/><circle cx="30" cy="24" r="10"/></svg><span>מערכות יחסים</span></div>
    <div class="tile"><svg viewBox="0 0 48 48"><path d="M8 38c4-8 10-2 14-8s2-12 8-16l8-3M30 11h8v8"/><circle cx="12" cy="36" r="3"/></svg><span>מצבי תקיעות או משבר</span></div>
    <div class="tile"><svg viewBox="0 0 48 48"><path d="M24 14C18 9 10 9 6 11v26c4-2 12-2 18 3 6-5 14-5 18-3V11c-4-2-12-2-18 3zM24 14v26"/></svg><span>הדרכת מטפלים</span></div>
    <!-- new tiles -->
    <div class="tile"><svg viewBox="0 0 48 48"><path d="M24 42V22"/><path d="M24 30c-9 0-12-7-12-14 9 0 12 6 12 14zM24 26c0-8 4-13 12-13 0 8-4 13-12 13z"/></svg><span>התפתחות אישית</span></div>
    <div class="tile"><svg viewBox="0 0 48 48"><path d="M16 22v-9a2 2 0 0 1 4 0v8M20 21v-11a2 2 0 0 1 4 0v11M24 21v-9a2 2 0 0 1 4 0v10M28 22v-6a2 2 0 0 1 4 0v14c0 8-5 12-10 12-6 0-9-4-11-9l-3-6a2 2 0 0 1 3-2l3 3"/></svg><span>התמכרויות</span></div>
  </div>
</main>
</body>
</html>
